dataset: db_bio
data_in: data/db_bio
split: indices/db_bio/test.txt
debug: false
annotations_in:
  - ../../../netscratch/yay/_ext_outputs/db_bio
target:
  key: label
  type: nominal
random_state: 42
head:
  type: logistic_classifier
  params:
    max_iter: 1000
    C: 2.0
    class_weight: balanced
    primary_metric: macro_f1
output:
  format: jsonl
  file: logs/utility/db_bio/label_task.jsonl
protocol: utility
source_splits:
- split: indices/db_bio/train.txt
  train: 1.0
- split: indices/db_bio/val.txt
  val: 1.0
vectorizer:
  type: tfidf
  params:
    max_features: 20000
    ngram_range:
    - 1
    - 3
    min_df: 1
    sublinear_tf: true
task_id: '{task_id}'
