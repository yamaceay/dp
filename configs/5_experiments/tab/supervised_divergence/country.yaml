dataset: tab
data_in: data/tab
split: indices/tab/test/50_eval/{task_id}.txt
debug: true
annotations_in:
  - outputs/tab
target:
  key: country_group
  type: nominal
source_splits:
  - train: 0.0
    val: 1.0
  - split: indices/tab/train/{task_id}.txt
    train: 1.0
    val: 0.0
  - split: indices/tab/val/{task_id}.txt
    train: 0.0
    val: 1.0
random_state: 42
head:
  type: bert_classifier
  params:
    epochs: 2
    init_checkpoint: ../../../netscratch/yay/tri_pipelines/tab/_checkpoints/50_eval_{task_id}/50_eval_{task_id}__task_{task_id}/finetuning/{checkpoint}
    checkpoint_dir: ../../../netscratch/yay/util_tri_pipelines/tab/country
    primary_metric: macro_f1
    encoder_lr: 1e-6
    head_lr: 5e-4
    early_stop_patience: 2
output:
output:
  format: jsonl
  file: logs/supervised_divergence/tab/country_task_{task_id}.jsonl
