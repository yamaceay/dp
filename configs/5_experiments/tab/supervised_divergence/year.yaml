dataset: tab
data_in: data/tab
split: indices/tab/test/50_eval/{task_id}.txt
debug: true
annotations_in:
  - outputs/tab
target:
  key: year_group
  type: ordinal
  enum:
    - 1975-1995
    - 1996-1998
    - 1999-2001
    - 2002-2004
    - 2005-2007
    - 2008-2010
    - 2011-2013
    - 2014-2019
source_splits:
  - train: 0.0
    val: 1.0
  - split: indices/tab/train/{task_id}.txt
    train: 1.0
    val: 0.0
  - split: indices/tab/val/{task_id}.txt
    train: 0.0
    val: 1.0
random_state: 42
head:
  type: bert_ordinal
  params:
    epochs: 8
    init_checkpoint: ../../../netscratch/yay/tri_pipelines/tab/_checkpoints/50_eval_{task_id}/50_eval_{task_id}__task_{task_id}/finetuning/{checkpoint}
    checkpoint_dir: ../../../netscratch/yay/util_tri_pipelines/tab/year
    primary_metric: macro_mae
    encoder_lr: 2e-6
    head_lr: 2e-4
    early_stop_patience: 3
output:
output:
  format: jsonl
  file: logs/supervised_divergence/tab/year_task_{task_id}.jsonl
