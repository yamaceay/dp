dataset: tab
data_in: data/tab
split: indices/tab/test/500_random/{task_id}.txt
debug: false
annotations_in:
- outputs/tab
target:
  key: country_group
  type: nominal
random_state: 42
head:
  type: logistic_classifier
  params:
    max_iter: 1000
    C: 2.0
    class_weight: balanced
    primary_metric: macro_f1
output:
  format: jsonl
  file: logs/utility/tab/country_task_{task_id}.jsonl
protocol: utility
source_splits:
- split: indices/tab/test/500_random/{task_id}.txt
  train: 1.0
- split: indices/tab/test/50_eval/{task_id}.txt
  val: 1.0
vectorizer:
  type: tfidf
  params:
    max_features: 20000
    ngram_range:
    - 1
    - 3
    min_df: 1
    sublinear_tf: true
task_id: '{task_id}'
