dataset: tab
data_in: data/tab
split: indices/tab/test/50_eval/{task_id}.txt
debug: true
annotations_in:
- outputs/tab
target:
  key: country_group
  type: nominal
random_state: 42
head:
  type: bert_classifier
  params:
    epochs: 2
    init_checkpoint: ../../../netscratch/yay/tri_pipelines/tab/_checkpoints/500_random_{task_id}/500_random_{task_id}__task_{task_id}/finetuning/{checkpoint}
    checkpoint_dir: ../../../netscratch/yay/util_tri_pipelines/tab/country_internal_utility
    primary_metric: macro_f1
    encoder_lr: 1e-6
    head_lr: 5e-4
    early_stop_patience: 2
    save_checkpoints: false
output:
  format: jsonl
  file: logs/utility/tab/country_task_{task_id}.jsonl
protocol: internal_utility
internal_utility:
  n_folds: 50
  random_state: '{task_id}'
vectorizer:
  type: text
task_id: '{task_id}'
