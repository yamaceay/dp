dataset: tab
data_in: data/TAB/splitted/test.json
debug: true
annotations_in:
  - outputs/tab
target:
  key: country_group
  type: nominal
split:
  - train: 0.0
    val: 1.0
  - path: data/TAB/splitted/train.json
    train: 1.0
    val: 0.0
  - path: data/TAB/splitted/dev.json
    train: 0.0
    val: 1.0
random_state: 42
head:
  type: bert_classifier
  params:
    epochs: 2
    init_checkpoint: ../../../netscratch/yay/tri_pipelines/tab/_checkpoints/tab__lr5e-5/finetuning/checkpoint-2310
    checkpoint_dir: ../../../netscratch/yay/util_tri_pipelines/tab/country
    primary_metric: macro_f1
    encoder_lr: 1e-6
    head_lr: 5e-4
    early_stop_patience: 2
output:
  format: jsonl
  file: logs/tab_country_exp.jsonl
