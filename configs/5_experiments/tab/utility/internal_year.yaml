dataset: tab
data_in: data/tab
split: indices/tab/test/50_eval/{task_id}.txt
debug: true
annotations_in:
- outputs/tab
target:
  key: year_group
  type: ordinal
  enum:
  - 1975-1995
  - 1996-1998
  - 1999-2001
  - 2002-2004
  - 2005-2007
  - 2008-2010
  - 2011-2013
  - 2014-2019
random_state: 42
head:
  type: logistic_classifier
  params:
    max_iter: 500
    class_weight: balanced
    n_jobs: -1
    primary_metric: f1
output:
  format: jsonl
  file: logs/internal_utility/tab_year_task_{task_id}.jsonl
protocol: internal_utility
internal_utility:
  n_folds: 50
  random_state: '{task_id}'
vectorizer:
  type: tfidf
  params:
    ngram_range:
    - 1
    - 2
    max_features: 10000
    min_df: 2
task_id: '{task_id}'
