dataset: tab
data_in: data/tab
split: indices/tab/test.txt
debug: false
annotations_in:
- /netscratch/yay/_ext_outputs/tab
target:
  key: year_group
  type: ordinal
random_state: 42
protocol: utility
source_splits:
- split: indices/tab/train.txt
  train: 1.0
- split: indices/tab/val.txt
  val: 1.0
head:
  type: bert_ordinal
  params:
    epochs: 2
    init_checkpoint: ../../../netscratch/yay/tri_pipelines/tab/_checkpoints/exact/exact/finetuning/{checkpoint}
    checkpoint_dir: ../../../netscratch/yay/util_tri_pipelines/tab/year_anonymized
    primary_metric: macro_mae
    encoder_lr: 1e-6
    head_lr: 5e-4
output:
  format: jsonl
  file: logs/utility/tab/year.jsonl