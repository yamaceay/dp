dataset: tab
data_in: data/tab
split: indices/tab/test/50_eval/{task_id}.txt
debug: true
annotations_in:
- outputs/tab
target:
  key: year_group
  type: ordinal
  enum:
  - 1975-1995
  - 1996-1998
  - 1999-2001
  - 2002-2004
  - 2005-2007
  - 2008-2010
  - 2011-2013
  - 2014-2019
random_state: 42
head:
  type: bert_ordinal
  params:
    epochs: 8
    init_checkpoint: ../../../netscratch/yay/tri_pipelines/tab/_checkpoints/500_random_{task_id}/500_random_{task_id}__task_{task_id}/finetuning/{checkpoint}
    checkpoint_dir: ../../../netscratch/yay/util_tri_pipelines/tab/year_internal_utility
    primary_metric: macro_mae
    encoder_lr: 2e-6
    head_lr: 2e-4
    early_stop_patience: 3
    save_checkpoints: false
output:
  format: jsonl
  file: logs/utility/tab/year_task_{task_id}.jsonl
protocol: internal_utility
internal_utility:
  n_folds: 50
  random_state: '{task_id}'
vectorizer:
  type: text
task_id: '{task_id}'
