dataset: tab
data_in: data/tab
split: indices/tab/test.txt
debug: false
annotations_in:
- outputs/tab
target:
  key: year_group
  type: ordinal
  enum:
  - 1975-1995
  - 1996-1998
  - 1999-2001
  - 2002-2004
  - 2005-2007
  - 2008-2010
  - 2011-2013
  - 2014-2019
random_state: 42
head:
  type: linear_ordinal_regressor
  params:
    primary_metric: macro_mae
output:
  format: jsonl
  file: logs/utility/tab/year_task_{task_id}.jsonl
protocol: utility
source_splits:
- split: indices/tab/train.txt
  train: 1.0
- split: indices/tab/val.txt
  val: 1.0
vectorizer:
  type: tfidf
  params:
    max_features: 20000
    ngram_range:
    - 1
    - 3
    min_df: 1
    sublinear_tf: true
task_id: '{task_id}'
