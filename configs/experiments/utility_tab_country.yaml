dataset: tab
data_in: data/TAB/splitted/test.json
debug: true
annotations_in:
  - outputs/tab
target:
  key: country_group
  type: nominal
split:
  - train: 0.0
    val: 1.0
  - path: data/TAB/splitted/train.json
    train: 1.0
    val: 0.0
  - path: data/TAB/splitted/dev.json
    train: 0.0
    val: 1.0
random_state: 42
head:
  type: bert_classifier
  params:
    epochs: 2
output:
  format: jsonl
  file: logs/tab_country_exp.jsonl
