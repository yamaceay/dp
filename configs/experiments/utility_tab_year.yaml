dataset: tab
data_in: data/TAB/splitted/test.json
debug: true
annotations_in:
  - outputs/tab
target:
  key: year_group
  type: nominal
  enum:
    - 1990-1995
    - 1996-1998
    - 1999-2001
    - 2002-2004
    - 2005-2007
    - 2008-2010
    - 2011-2013
    - 2014-2019
split:
  - train: 0.8
    val: 0.2
random_state: 42
head:
  type: bert_classifier
  params:
    model_name: bert-base-uncased
    init_checkpoint: models/tri_pipelines/tab/old_pipeline/finetuning/checkpoint-532
    checkpoint_dir: models/tri_pipelines/tab/utility_year
    batch_size: 8
    epochs: 3
    lr: 1e-5
    device: auto
    primary_metric: acc
    target_acc: 0.8
output:
  format: jsonl
  file: logs/tab_year_exp.jsonl
