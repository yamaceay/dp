params:
  epsilon: "*"
  lambdas: ["*"]

explainer:
  name: shap
  tri_pipeline: ../../../netscratch/yay/tri_pipelines/tab/_checkpoints/full/full
  risk_temperature: 0.1

precomputation:
  risk_scores: data/tab/tri_risk/shap.jsonl
  result_in: ../../../netscratch/yay/_ext_outputs/tab/presidio/{run_timestamp}_tab_presidio.jsonl

dpmlm_chunking:
  enabled: true
  max_tokens: 256
  overlap_tokens: 128

token_selection:
  name: pii_only
  pii_annotator: ../../../netscratch/yay/pii_detectors/tab/tab__lr3e-5__bs8__m_partial_recall
  pii_chunking:
    enabled: true
  pii_aggregation_strategy: none
  pii_force_non_o_prediction: true
