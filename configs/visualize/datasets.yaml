dataset_sets:
  - names: 
    - name: tab
      print_as: "TAB"
    - name: db_bio
      print_as: "DB-Bio"
    scores:
      - name: privacy_exact_mean_reciprocal_rank
        rename_as: P_exact
        best: 0
        worst: 1
      - name: privacy_more_mean_reciprocal_rank
        rename_as: P_more
        best: 0
        worst: 1
      - name: privacy_full_mean_reciprocal_rank
        rename_as: P_full
        best: 0
        worst: 1
      - name: privacy_exact_accuracy
        rename_as: TRIR_exact
        best: 0
        worst: 1
      - name: privacy_more_accuracy
        rename_as: TRIR_more
        best: 0
        worst: 1
      - name: privacy_full_accuracy
        rename_as: TRIR_full
        best: 0
        worst: 1
      - name: utility_utility_nominal_raw_acc
        rename_as: U_acc
        best: 1
        worst: 0
      - name: utility_utility_ordinal_raw_mae
        rename_as: U_mae
        best: 0
        worst: 1
      - name: supervised_divergence_utility_nominal_raw_acc
        rename_as: SD_acc
        best: 1
        worst: 0
      - name: supervised_divergence_utility_ordinal_raw_mae
        rename_as: SD_mae
        best: 0
        worst: 1
      - name: divergence_bertscore
        rename_as: D_bertscore
        best: 0
        worst: 1
        exclude:
          - baseline
      - name: divergence_cosine
        rename_as: D_cosine
        best: 0
        worst: 1
        exclude:
          - baseline
      - name: divergence_pp
        rename_as: D_pp
        best: 0
        worst: 1
        exclude:
          - baseline
          - spacy
          - presidio
          - manual
          - baroud
      - name: runtime_avg_anon_time_s
        rename_as: T_anon_avg_s
        best: 0
        worst: float("inf")
    meta_scores:
      - avg: [P_exact, P_more, P_full]
        rename_as: P
        category: privacy
      - avg: [P_exact, P_more]
        rename_as: P
        split: test
        category: privacy
      - avg: [TRIR_exact, TRIR_more, TRIR_full]
        rename_as: TRIR
        category: privacy
      - avg: [TRIR_exact, TRIR_more]
        rename_as: TRIR
        split: test
        category: privacy
      - avg: [U_acc]
        rename_as: U
        category: utility
      - avg: [SD_acc]
        rename_as: SD
        category: utility
      - avg: [D_bertscore, D_cosine, D_pp]
        rename_as: D
        category: divergence
        strategy: smallest_subset
      - avg: [D_pp]
        rename_as: D
        split: test
        category: divergence
        strategy: smallest_subset
      - avg: [T_anon_avg_s]
        rename_as: T
        category: runtime
      - div: [P, original(P)]
        rename_as: rel_P
        best: 0
        worst: float("inf")
        category: privacy
      - div: [U, original(U)]
        rename_as: rel_U
        best: 1
        worst: 0
        category: utility
      - sub: [rel_U, rel_P]
        rename_as: GAIN
        category: compound
